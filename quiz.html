<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- prog + timer -->
  <div class="quiz-header-ui">
    <div class="progress-container">
      <div class="progress-bar" id="quiz-progress"></div>
    </div>
    <div class="quiz-timer">Time: <span id="global-time">60</span>s</div>
  </div>

  <!-- scroll cont (scroll lock) -->
  <main class="scroll-container scroll-locked">
    
    <!-- Page 1 -->
    <section class="page" id="page1">
      <div class="content">
        <h1>QUESTION 01</h1>
        <p class="question-prompt">Who is Viscoria?</p>
        <div class="quiz-options">
          <button class="quiz-btn" data-correct="false">Somata's little sister</button>
          <button class="quiz-btn" data-correct="false">The goddess's mother</button>
          <button class="quiz-btn" data-correct="true">The Knight of Disharmony</button>
          <button class="quiz-btn" data-correct="false">Echo's companion</button>
        </div>
      </div>
    </section>

    <!-- Page 2 -->
    <section class="page" id="page2">
      <div class="content">
        <h1>QUESTION 02</h1>
        <p class="question-prompt">What weapon does Viscoria use?</p>
        <div class="quiz-options">
          <button class="quiz-btn" data-correct="false">Trident</button>
          <button class="quiz-btn" data-correct="false">Sword</button>
          <button class="quiz-btn" data-correct="true">Spear</button>
          <button class="quiz-btn" data-correct="false">Flute</button>
        </div>
      </div>
    </section>

    <!-- Page 3 -->
    <section class="page" id="page3">
      <div class="content">
        <h1>QUESTION 03</h1>
        <p class="question-prompt">Which wave is Viscoria's boss fight?</p>
        <div class="quiz-options">
          <button class="quiz-btn" data-correct="false">5</button>
          <button class="quiz-btn" data-correct="false">7</button>
          <button class="quiz-btn" data-correct="true">10</button>
          <button class="quiz-btn" data-correct="false">9</button>
        </div>
      </div>
    </section>

    <!-- Page 4 -->
    <section class="page" id="page4">
      <div class="content">
        <h1 class="glitch-text" data-text="QUESTION 04">QUESTION 04</h1>
        <p class="question-prompt">Are you an intruder?</p>
        <div class="quiz-options">
          <button class="quiz-btn" data-correct="false">NO</button>
          <button class="quiz-btn" data-correct="false">NO</button>
          <button class="quiz-btn" data-correct="false">NO</button>
          <button class="quiz-btn" data-correct="false">NO</button>
        </div>
      </div>
    </section>

    <!-- Page 5 (last qn has data-speed="fast") -->
    <section class="page" id="page5" data-speed="fast">
      <div class="content">
        <h1 class="glitch-text" data-text="QUESTION 05">QUESTION 05</h1>
        <p class="question-prompt">DID I DESERVE IT ALL?</p>
        <div class="quiz-options">
          <button class="quiz-btn" data-correct="true">YES</button>
          <button class="quiz-btn" data-correct="true">YES</button>
          <button class="quiz-btn" data-correct="true">YES</button>
          <button class="quiz-btn" data-correct="true">YES</button>
        </div>
      </div>
    </section>

    <!-- results -->
    <section class="page" id="page6">
      <div class="content">
        <h1>TH▀▚▞𝄢⧉⪡E EN▚d</h1>
        <p class="question-prompt">Your journey ends here. Are you proud of yourself?</p>
        <div class="score-board">
          <h2>Score: <span id="final-score">0</span></h2>
          <button class="restart-btn" onclick="window.location.reload()">RETRY</button>
        </div>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
